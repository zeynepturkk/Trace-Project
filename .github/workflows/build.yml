name: Build RayTracer

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: project

    - name: Download FLTK
      run: |
        Invoke-WebRequest -Uri "https://github.com/fltk/fltk/releases/download/release-1.3.3/fltk-1.3.3-bin-vs2015.zip" -OutFile fltk.zip
        Expand-Archive fltk.zip -DestinationPath .
      shell: pwsh

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Project
      run: msbuild project/ray.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: ray-exe
        path: project/**/ray.exe
