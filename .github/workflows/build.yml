name: Build RayTracer
on: [push, workflow_dispatch]
jobs:
build:
runs-on: windows-latest
steps:
name: Checkout Code
uses: actions/checkout@v4
name: Download FLTK Source
run: |
Invoke-WebRequest -Uri "https://github.com/fltk/fltk/releases/download/release-1.3.3/fltk-1.3.3-source.tar.gz" -OutFile fltk.tar.gz
tar -xzf fltk.tar.gz
shell: pwsh
name: Build FLTK
run: |
cd fltk-1.3.3
mkdir build
cd build
cmake .. -G "Visual Studio 17 2022" -A Win32 -DCMAKE_BUILD_TYPE=Release
cmake --build . --config Release
shell: pwsh
name: Add MSBuild to PATH
uses: microsoft/setup-msbuild@v2
name: Build Project
run: msbuild ray.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
name: Upload EXE
uses: actions/upload-artifact@v4
with:
name: ray-exe
path: "/ray.exe"
